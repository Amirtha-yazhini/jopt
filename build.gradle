plugins {
    id 'java'
    id 'application'
}

group = 'jopt'
version = '0.1.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

def asmVersion = '9.7.1'

sourceSets {
    // A small, deliberately "naively written" app that the demo task optimizes.
    demo { java.srcDir 'src/demo/java' }
}

dependencies {
    // ASM is used only to read and write class files; the IR, analyses and passes are our own.
    implementation "org.ow2.asm:asm:$asmVersion"
    implementation "org.ow2.asm:asm-tree:$asmVersion"
    implementation "org.ow2.asm:asm-analysis:$asmVersion"
    implementation "org.ow2.asm:asm-util:$asmVersion"

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'jopt.Main'
    applicationName = 'jopt'
}

tasks.named('run') { workingDir = rootDir }

test {
    useJUnitPlatform()
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat 'full' }
    maxHeapSize = '1g'
}

tasks.register('demo', JavaExec) {
    group = 'application'
    description = 'Optimizes the sample app in src/demo, runs both versions and writes build/demo/report.html.'
    dependsOn 'classes', 'demoClasses'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'jopt.Main'
    workingDir = rootDir
    def build = layout.buildDirectory.get().asFile
    args 'demo', new File(build, 'classes/java/demo').path, new File(build, 'demo').path
}
