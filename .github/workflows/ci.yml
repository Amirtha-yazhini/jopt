name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} · Java ${{ matrix.java }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ['21']
        node: ['20']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Java test suite
        run: |
          ./gradlew test --no-daemon
        if: runner.os != 'Windows'

      - name: Run Java test suite (Windows)
        run: |
          .\gradlew.bat test --no-daemon
        if: runner.os == 'Windows'

      - name: Build distribution CLI
        run: |
          ./gradlew installDist --no-daemon
        if: runner.os != 'Windows'

      - name: Build distribution CLI (Windows)
        run: |
          .\gradlew.bat installDist --no-daemon
        if: runner.os == 'Windows'

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Frontend type check
        working-directory: web
        run: npm run typecheck

      - name: Frontend lint
        working-directory: web
        run: npm run lint

      - name: Frontend unit & integration tests
        working-directory: web
        run: npm test

      - name: Frontend production build
        working-directory: web
        run: npm run build
